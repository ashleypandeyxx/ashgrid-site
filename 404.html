<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — AshGrid</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0A0A0B" />
<link rel="icon" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --f-serif:"Instrument Serif",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  --bg:#0A0A0B; --t1:#F4F3F0; --t2:rgba(244,243,240,0.62); --t3:rgba(244,243,240,0.38);
  --accent:#6FE3AE; --hairline:rgba(244,243,240,0.09); color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#DEDBD2; --t1:#16140F; --t2:rgba(22,20,15,0.68); --t3:rgba(22,20,15,0.44);
  --accent:#0E8F62; --hairline:rgba(22,20,15,0.12); color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--t1);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;padding:24px;
}
main{max-width:480px;text-align:center}
.code{font-family:var(--f-mono);font-size:11px;letter-spacing:0.22em;color:var(--t3);
  text-transform:uppercase}
h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(34px,7vw,52px);
  line-height:1.08;margin:14px 0 0}
p{color:var(--t2);font-size:16px;line-height:1.6;margin:18px 0 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
a.btn{
  font-family:var(--f-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--t1);text-decoration:none;border:1px solid var(--hairline);
  border-radius:999px;padding:13px 22px;min-height:44px;display:inline-flex;align-items:center;
}
a.btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="code">404 · Page not found</div>
  <h1>There&rsquo;s nothing at this address.</h1>
  <p>The page may have moved, or it never existed. Everything on this site is reachable
  from the home page.</p>
  <div class="row">
    <a class="btn" href="/">Home</a>
    <a class="btn" href="/privacy">Privacy</a>
    <a class="btn" href="/terms">Terms</a>
  </div>
</main>
<script>
(function(){
  try{
    var saved = localStorage.getItem('ag-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (matchMedia('(prefers-color-scheme: light)').matches)
      document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
})();
</script>
</body>
</html>
