<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Only for clients without JS. A meta refresh in the open head would race the
     script below and win sometimes, redirecting WITHOUT the OAuth parameters --
     which is the exact bug the script exists to avoid. The app cannot run without
     JS anyway, so losing the query string on this path costs nothing. -->
<noscript><meta http-equiv="refresh" content="0; url=/app/"></noscript>
<link rel="canonical" href="https://ashgrid.co/app/">
<title>AshGrid</title>
<style>
  html,body{background:#0A0A0B;color:#EDEDEC;height:100%;margin:0;
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,sans-serif}
  a{color:#5FBF8F}
</style>
</head>
<body>
<script>
// Forward the query string and hash, not just the path. Supabase sends the OAuth
// callback to window.location.origin -- which is this page, since an origin never
// includes a path -- carrying ?code= (PKCE) or #access_token=. The app runs with
// detectSessionInUrl:false and exchanges that code itself in app/_layout.tsx, so a
// redirect that dropped the parameters silently threw the sign-in away and landed
// the user back on the login screen with no error.
location.replace('/app/' + window.location.search + window.location.hash);
</script>
<p>Taking you to <a href="/app/">AshGrid</a>&hellip;</p>
</body>
</html>
